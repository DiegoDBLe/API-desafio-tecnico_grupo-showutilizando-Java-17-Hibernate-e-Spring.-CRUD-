spring:
  application:
    name: veiculo-api

  datasource:
    url: jdbc:mysql://localhost:3306/veiculo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: veiculo_user
    password: veiculo123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: veiculo-api-secret-key-123456-abcdef
  expiration: 3600000
